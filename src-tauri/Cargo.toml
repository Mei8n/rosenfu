[package]
name = "rosenfu-desktop"
version.workspace = true
edition.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rosenfu-core = { path = "../crates/rosenfu-core" }
tauri = { version = "2", features = [] }
rosenfu-storage = { path = "../crates/rosenfu-storage" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "=0.23.1"
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "rustls"] }

[dev-dependencies]
tempfile = "3"

[features]
dev-shimada-bus-lab = ["rosenfu-core/dev-shimada-bus-lab"]
