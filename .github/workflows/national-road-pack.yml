name: National road pack generator
on:
  pull_request:
    paths: ['scripts/road-pack/**', '.github/workflows/national-road-pack.yml']
permissions:
  contents: read
jobs:
  generator:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install osmium==4.3.2 shapely==2.1.2
      - run: python -B -m unittest discover -s scripts/road-pack -v
