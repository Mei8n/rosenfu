name: Water inspection panel
on:
  pull_request:
    paths:
      - 'src/WaterEvidenceInspector*'
      - 'src/waterEvidenceInspector.css'
      - '.github/workflows/water-inspection-panel.yml'
permissions:
  contents: read
jobs:
  panel:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test -- src/WaterEvidenceInspector.test.tsx src/waterEvidenceDiagnostics.test.ts src/waterEvidenceDelivery.test.ts src/waterEvidenceComposite.test.ts
      - run: npx tsc --noEmit
