name: Check
on:
  push:
    branches: [main, dev/alpha-0.2-integration]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: npm ci
      - name: Verify IDE dependency preparation
        run: |
          node scripts/ensure-dependencies.mjs
          node scripts/ensure-dependencies.mjs
      - name: Verify debug server lifecycle
        run: node --test scripts/debug-dev-server.check.mjs
      - name: Build native development debugger target
        run: cargo build --locked -p rosenfu-desktop
      - run: npm test
      - run: npm run build
      - run: cargo fmt --all --check
      - name: Clippy workspace and all targets
        run: cargo clippy --locked --workspace --all-targets
      - run: cargo test --locked --workspace
      - name: Build desktop executable
        run: npm run tauri -- build --no-bundle

  windows-alpha02-package:
    name: Windows x64 α0.2 test package
    needs: check
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/dev/alpha-0.2-integration') ||
      (github.event_name == 'pull_request' &&
       github.base_ref == 'dev/alpha-0.2-integration' &&
       (github.head_ref == 'ci/alpha02-windows-test-package-20261120' ||
        github.head_ref == 'integrate/alpha02-test-play-20261120') &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Test the archive verifier
        run: python scripts/windows-qa-archive.test.py
      - name: Bundle Windows installer
        run: npm run tauri -- build --target x86_64-pc-windows-msvc --config src-tauri/tauri.alpha02-qa.conf.json --ci
      - name: Stage test package and checksum
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $source -cne $env:GITHUB_SHA -or $source -cnotmatch '^[a-f0-9]{40}$') {
            throw 'Checked-out source does not match the workflow SHA'
          }
          $bundles = @(Get-ChildItem -LiteralPath target/x86_64-pc-windows-msvc/release/bundle/nsis -Filter '*-setup.exe' -File)
          if ($bundles.Count -ne 1 -or $bundles[0].Length -lt 65536) {
            throw 'Expected one nonempty Windows NSIS installer'
          }
          $short = $source.Substring(0, 12)
          $kind = if ($env:GITHUB_EVENT_NAME -eq 'push') { 'integration' } else { 'preview' }
          $stage = New-Item -ItemType Directory -Path qa-artifact
          $name = "Rosenfu-alpha02-$kind-$short-windows-x64-setup.exe"
          $file = Join-Path $stage.FullName $name
          Copy-Item -LiteralPath $bundles[0].FullName -Destination $file
          Copy-Item -LiteralPath docs/windows-alpha02-test-play.txt -Destination $stage.FullName
          $notices = New-Item -ItemType Directory -Path (Join-Path $stage.FullName 'data-and-notices')
          Copy-Item -LiteralPath public/road-data -Recurse -Destination $notices.FullName
          Copy-Item -LiteralPath data/water-japan-coarse-20261114 -Recurse -Destination $notices.FullName
          Copy-Item -LiteralPath docs/water-mask-model.md -Destination $notices.FullName
          Copy-Item -LiteralPath src/assets/fonts/line-seed-jp/OFL.txt -Destination (Join-Path $notices.FullName 'LINE-Seed-JP-OFL.txt')
          $digest = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath (Join-Path $stage.FullName 'SHA256SUMS.txt') -Encoding ascii -Value "$digest  $name"
          Set-Content -LiteralPath (Join-Path $stage.FullName 'BUILD.txt') -Encoding ascii -Value @(
            "commit=$source", "ref=$env:GITHUB_REF", "kind=$kind", "run=$env:GITHUB_RUN_ID", "attempt=$env:GITHUB_RUN_ATTEMPT",
            'audience=internal-QA-only', 'native-installer-notices-review=pending'
          )
          if ($kind -eq 'preview') {
            Add-Content -LiteralPath (Join-Path $stage.FullName 'BUILD.txt') -Encoding ascii -Value 'Packaging verification only; not a test-play release.'
          }
      - name: Stage Windows application software notices
        run: node scripts/windows-qa-notices.mjs qa-artifact/data-and-notices/software
      - name: Smoke the staged Windows installer
        shell: pwsh
        run: ./scripts/Smoke-WindowsAlpha02.ps1 -ArtifactDirectory qa-artifact -TimeoutSeconds 60
      - name: Build and reverify the Windows QA ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path qa-upload | Out-Null
          $short = $env:GITHUB_SHA.Substring(0, 12)
          $kind = if ($env:GITHUB_EVENT_NAME -eq 'push') { 'integration' } else { 'preview' }
          $zip = "qa-upload/Rosenfu-alpha02-$kind-$short-windows-x64.zip"
          $checksum = python scripts/windows-qa-archive.py qa-artifact $zip
          if ($LASTEXITCODE -ne 0 -or $checksum -cnotmatch '^[a-f0-9]{64}  Rosenfu-alpha02-') {
            throw 'QA ZIP creation or readback verification failed'
          }
          Set-Content -LiteralPath qa-upload/ZIP-SHA256.txt -Encoding ascii -Value $checksum
        # Internal workflow artifact, not a public release or distribution approval.
      - uses: actions/upload-artifact@v4
        with:
          name: rosenfu-alpha02-windows-x64-${{ github.sha }}
          path: qa-upload/
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
