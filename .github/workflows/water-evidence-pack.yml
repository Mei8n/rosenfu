name: Water evidence pack
on:
  pull_request:
    paths:
      - 'scripts/water-pack/**'
      - 'src/waterEvidencePack*'
      - '.github/workflows/water-evidence-pack.yml'
permissions:
  contents: read
jobs:
  water-pack:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      TMPDIR: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/water-pack/requirements.txt -r scripts/water-pack/requirements-marine.txt
      - run: python -B -m unittest discover -s scripts/water-pack -p 'test_*.py' -v
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test -- src/waterEvidencePack.test.ts src/automaticWaterData.test.ts
      - run: node --test scripts/water-pack/roundtrip.check.mjs
