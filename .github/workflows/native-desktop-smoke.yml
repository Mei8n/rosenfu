name: One-off native desktop smoke (#285)
on:
  pull_request:
    branches: [dev/alpha-0.2-integration]
    types: [labeled]
permissions:
  contents: read
concurrency:
  group: native-desktop-smoke-285-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false
jobs:
  native-desktop-smoke:
    if: >-
      github.run_attempt == '1' &&
      github.event.label.name == 'qa:native-desktop-83fe184bc962' &&
      github.event.pull_request.number == 285 &&
      github.event.pull_request.draft == true &&
      github.repository == 'Mei8n/rosenfu' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'work/alpha02-road-reuse'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Check exact candidate and event before dependency changes
        run: python3 -B scripts/native-desktop-smoke/guard.py
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install runner's Linux WebView dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev webkit2gtk-driver xvfb xauth dbus-daemon
      - name: Run native Bus, ordinary Tram and opt-in laboratory Tram GUI
        run: bash scripts/native-desktop-smoke/run.sh
