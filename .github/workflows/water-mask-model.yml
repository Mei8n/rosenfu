name: Water mask model
on:
  pull_request:
    paths:
      - 'src/waterMaskModel.ts'
      - 'src/waterMaskModel.test.ts'
      - 'package-lock.json'
      - '.github/workflows/water-mask-model.yml'
permissions:
  contents: read
jobs:
  water-mask:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      TMPDIR: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test -- src/waterMaskModel.test.ts
