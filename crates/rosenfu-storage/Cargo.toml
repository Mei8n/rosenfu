[package]
name = "rosenfu-storage"
version.workspace = true
edition.workspace = true

[dependencies]
rosenfu-core = { path = "../rosenfu-core" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
tempfile = "3"
sha2 = "0.10"
base64 = "=0.23.1"

[features]
periodic-world-qa = ["rosenfu-core/periodic-world-qa"]
standard-periodic-rail = ["rosenfu-core/standard-periodic-rail"]
