[package]
name = "rosenfu-core"
version.workspace = true
edition.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }

sha2 = "=0.10.9"
serde_json = { version = "1", features = ["float_roundtrip"] }

[dev-dependencies]
serde_json = { version = "1", features = ["float_roundtrip"] }

[features]
# Local debug source build only; intentionally absent from default features.
dev-road-lab = []
# Separate isolated QA codec, never a default World save mode.
periodic-world-qa = []
# Explicit opt-in native binding; desktop/default builds do not enable this.
standard-periodic-rail = []
